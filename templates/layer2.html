{% extends 'index.html' %}
{% block container %}
<div class="container-fuild mt-5 mx-3 ps-3">
    <div class="row contentrow">
        
        <div class="col">
            <div class="col-md-3 leftcol">
                <h3>Rules :</h3>
            </div>

            <div class="col-md-9 d-flex align-items-center">
                <div class="form-check me-4">
                    <input class="form-check-input" type="radio" name="categoryType" id="newCategory" value="new"
                        checked>
                    <label class="form-check-label" for="newCategory">
                        New
                    </label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="categoryType" id="existingCategory"
                        value="existing">
                    <label class="form-check-label" for="existingCategory">
                        Existing
                    </label>
                </div>
            </div>
        </div>
    </div>
    <div class="row contentrow">
        <div class="col flex-column mb-0 !important">
            <div class="col mb-4" style="margin-bottom: 0 !important;">
                <div class="col-md-3 leftcol d-flex justify-content-end">
                    <h3>Select Category :</h3>
                </div>

                <div class="col-md-9 d-flex align-items-center">
                    <select id="column-select" class="inputbox me-2" style="width: 20%;">
                        <option selected>Tag Name 3</option>
                        
                        <option value="1">Tag Name 1</option>
                        <option value="2">Tag Name 2</option>
                        <option value="3">Tag Name 3</option>
                        <option value="4">Tag Name 4</option>
                    </select>
                </div>
            </div>

        </div>
        <div class="col flex-column" id="existingCategoryContent" style="display: none;">
            <div class="col mb-4">
                <div class="col-md-3 leftcol d-flex justify-content-end">
                    <button type="button" class="btn plus-widget" id="add" onclick="addExistCategory(this)">
                        +
                    </button>
                </div>

                <div class="col-md-9 d-flex align-items-center">
                    <h4 style="margin-bottom: 0;">Add Category</h4>
                </div>
            </div>
            <div class="col existcategoryContent">
                <div class="col-md-3 leftcol d-flex justify-content-end">
                    <button class="minus minus-widget">-</button>
                </div>
                <div class="col-md-9">
                    <div class="lang">
                        <div class="inputcontainer" style="display: flex; align-items: center">
                            <div class="categoryForms" id="existingCategoryForm">
                                <div class="form-group ms-3 me-2 inputbox">
                                    <label for="input1" class="tableInputEX">
                                        Select Table Name
                                    </label>
                                    <select class="form-select" id="category_input"
                                        aria-label="Example select with button addon">
                                        <option selected>Select Table Name</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                                <span class="pipe">|</span>
                                <div class="form-group ms-2 me-2 inputbox">
                                    <label for="input1" class="tableInputEX">
                                        Select Column Name
                                    </label>
                                    <select class="form-select" id="category_input"
                                        aria-label="Example select with button addon">
                                        <option selected>Select Column Name</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                                <span class="isEqual"><strong>=</strong></span>
                                <div class="cat_tables ms-2">
                                    <p>Table<span>1</span>_Column<span>1</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row contentrow">
        <div class="col flex-column">
            <div class="col mb-4">
                <div class="col-md-3 leftcol d-flex justify-content-end">
                    <h3>Select Table Name :</h3>
                </div>

                <div class="col-md-9 d-flex align-items-center">
                    <select id="column-select" class="inputbox me-2" style="width: 20%;">
                        <option selected>Select Table Name</option>
                        
                        <option value="1">Table Name 1</option>
                        <option value="2">Table Name 2</option>
                        <option value="3">Table Name 3</option>
                        <option value="4">Table Name 4</option>
                    </select>
                </div>
            </div>

        </div>
        <div class="col flex-column" id="existingCategoryContent" style="display: none;">
            <div class="col mb-4">
                <div class="col-md-3 leftcol d-flex justify-content-end">
                    <button type="button" class="btn plus-widget" id="add" onclick="addExistCategory(this)">
                        +
                    </button>
                </div>

                <div class="col-md-9 d-flex align-items-center">
                    <h4 style="margin-bottom: 0;">Add Category</h4>
                </div>
            </div>
            <div class="col existcategoryContent">
                <div class="col-md-3 leftcol d-flex justify-content-end">
                    <button class="minus minus-widget">-</button>
                </div>
                <div class="col-md-9">
                    <div class="lang">
                        <div class="inputcontainer" style="display: flex; align-items: center">
                            <div class="categoryForms" id="existingCategoryForm">
                                <div class="form-group ms-3 me-2 inputbox">
                                    <label for="input1" class="tableInputEX">
                                        Select Table Name
                                    </label>
                                    <select class="form-select" id="category_input"
                                        aria-label="Example select with button addon">
                                        <option selected>Select Table Name</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                                <span class="pipe">|</span>
                                <div class="form-group ms-2 me-2 inputbox">
                                    <label for="input1" class="tableInputEX">
                                        Select Column Name
                                    </label>
                                    <select class="form-select" id="category_input"
                                        aria-label="Example select with button addon">
                                        <option selected>Select Column Name</option>
                                        <option value="1">One</option>
                                        <option value="2">Two</option>
                                        <option value="3">Three</option>
                                    </select>
                                </div>
                                <span class="isEqual"><strong>=</strong></span>
                                <div class="cat_tables ms-2">
                                    <p>Table<span>1</span>_Column<span>1</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row contentrow">
        <div class="col">
            <div class="col-md-3 leftcol">
                <h3>Rules :</h3>
            </div>

            <div class="col-md-9 d-flex align-items-center">
                <button class="plus-widget" id="addRuleBtn">+</button>
            </div>
        </div>
    </div>
    <div class="row contentrow">
        <div class="col">
            <div class="col-md-3 leftcol"></div>
            <div class="col-md-9 d-flex align-items-start justify-content-center flex-column" id="rulesContainer">
                <div class="rulesbox d-flex align-items-center justify-content-between w-100 mb-3">
                    <div class="col-md-4 leftrule d-flex align-items-center justify-content-between ps-0 pb-2">

                        <button class="minus-widget">-</button>
                        <h5 style="margin-bottom: 0 !important;">Rule <span id="rulecount">1</span> :</h5><select
                            id="column-select" class="inputbox me-2">
                            <option selected>Select Table Name</option>
                            <option value="1">Table Name 1</option>
                            <option value="2">Table Name 2</option>
                            <option value="3">Table Name 3</option>
                            <option value="4">Table Name 4</option>
                        </select>
                    </div>
                    <div class="col d-flex flex-column mb-0">
                        <div class="rightrule d-flex  align-items-center justify-content-evenly mb-2" id="inputBoxContainer"
                            style="margin-right: 15rem;" >

                            <button class="plus-widget" id="inputbkey">+</button> <input type="text" class="inputbox"
                                id="key-input" placeholder="key" style="width: 30%;"> <input type="text"
                                class="inputbox" id="value-input" placeholder="value" style="width: 30%;">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row contentrow">

        <div class="col d-flex justify-content-center">
            <button class="primary-btn">Extract Data </button>

        </div>

    </div>
</div>
{% endblock %}
